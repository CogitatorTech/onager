name: Publish Playground App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-extension:
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.4
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5.4
      extension_name: onager
      enable_rust: true
      upload_all_extensions: true
      exclude_archs: "linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;wasm_threads"

  assemble:
    name: Assemble and upload playground
    needs: build-extension
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v1.5.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Wasm extension artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: onager-${{ env.DUCKDB_VERSION }}-extension-wasm_*
          path: wasm-extensions

      - name: Assemble playground tree
        run: |
          set -euo pipefail
          # With a custom custom_extension_repository, DuckDB-Wasm requests the extension at
          # <repo>/<version>/<platform>/<name>.duckdb_extension.wasm (no "duckdb-wasm/" segment;
          # that prefix only applies to the default repository layout). Build that path exactly.
          mkdir -p playground
          cp -R web/. playground/
          for platform in wasm_eh wasm_mvp; do
            src=$(find "wasm-extensions/onager-${DUCKDB_VERSION}-extension-${platform}" \
              -name '*.duckdb_extension.wasm' | head -n1)
            if [ -z "$src" ]; then
              echo "::error::No ${platform} extension found in downloaded artifacts"
              exit 1
            fi
            dest="playground/extensions/${DUCKDB_VERSION}/${platform}"
            mkdir -p "$dest"
            cp "$src" "$dest/onager.duckdb_extension.wasm"
          done
          echo "Assembled playground tree:"
          find playground -type f | sort

      - name: Upload playground artifact
        uses: actions/upload-artifact@v4
        with:
          name: playground
          path: playground
          retention-days: 7
          if-no-files-found: error
