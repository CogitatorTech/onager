name: Build Web Playground

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build only the browser (WASM) variants of the Onager extension against the stable DuckDB
  # release. upload_all_extensions keeps the DuckDB "repository" directory layout, which already
  # contains the version segment the browser requests, so the assemble step does not hardcode it.
  build-extension:
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.4
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5.4
      extension_name: onager
      enable_rust: true
      upload_all_extensions: true
      # Leave only wasm_eh and wasm_mvp: exclude every native arch and the threaded WASM build
      # (wasm_threads stays excluded until the threaded rayon/pthreads path is validated).
      exclude_archs: "linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;wasm_threads"

  assemble:
    name: Assemble and upload playground
    needs: build-extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM extension artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: onager-v1.5.4-extension-wasm_*
          path: wasm-extensions
          merge-multiple: true

      - name: Assemble playground tree
        run: |
          set -euo pipefail
          mkdir -p playground/extensions/duckdb-wasm
          # Static app files.
          cp -R web/. playground/
          # DuckDB-WASM requests <repo>/duckdb-wasm/<version>/<platform>/onager.duckdb_extension.wasm.
          # The downloaded artifacts preserve the <version>/<platform>/*.wasm repository layout, so
          # copy them under the duckdb-wasm/ prefix the browser expects.
          cp -R wasm-extensions/. playground/extensions/duckdb-wasm/
          echo "Assembled playground tree:"
          find playground -type f | sort

      - name: Upload playground artifact
        uses: actions/upload-artifact@v4
        with:
          name: playground
          path: playground
          retention-days: 7
          if-no-files-found: error
