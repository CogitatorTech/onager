[package]
name = "onager"
version = "0.4.0"
edition = "2021"
rust-version = "1.86"
publish = false
description = "A Graph Analytics Toolbox for DuckDB"

[lib]
name = "onager"
crate-type = ["staticlib", "cdylib"]

[features]
duckdb_extension = []
default = []

[dependencies]
graphina = { path = "../external/graphina", features = ["centrality", "community", "mst", "traversal", "subgraphs", "metrics", "links", "parallel", "approximation"] }
once_cell = "1.19"
parking_lot = "0.12"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ordered-float = "5"

# This is used to configure the global rayon pool for single-threaded WebAssembly builds.
# Note that the version must stay in sync with the rayon version used by Graphina.
[target.'cfg(target_os = "emscripten")'.dependencies]
rayon = "1.10.0"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 0
debug = true
